name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: docs
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the reviewed source revisions
        id: refs
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sources = json.loads(Path("sources.lock.json").read_text())["sources"]
          assert set(sources) == {"cube", "play", "recipes"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, revision in sources.items():
                  assert isinstance(revision, str) and re.fullmatch("[0-9a-f]{40}", revision)
                  print(f"{name}={revision}", file=output)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/cube
          ref: ${{ steps.refs.outputs.cube }}
          path: sources/cube
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/play
          ref: ${{ steps.refs.outputs.play }}
          path: sources/play
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/recipes
          ref: ${{ steps.refs.outputs.recipes }}
          path: sources/recipes
          persist-credentials: false
      - name: Test publishing and link-check failures
        run: python3 -m unittest discover -s tests -v
      - name: Check the authored Markdown
        run: |
          python3 tools/check_links.py .
          python3 tools/check_links.py ../sources/cube
          python3 tools/check_links.py ../sources/play
          python3 tools/check_links.py ../sources/recipes
      - name: Install pinned mdBook
        run: python3 tools/install_mdbook.py
      - name: Build and verify the recorded sources
        run: python3 tools/site.py build --sources-root ../sources --locked
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
