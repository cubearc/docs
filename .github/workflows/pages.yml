name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: docs

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: docs
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Read the reviewed source revisions
        id: refs
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          sources = json.loads(Path("sources.lock.json").read_text())["sources"]
          assert set(sources) == {"cube", "play", "recipes"}
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, revision in sources.items():
                  assert isinstance(revision, str) and re.fullmatch("[0-9a-f]{40}", revision)
                  print(f"{name}={revision}", file=output)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/cube
          ref: ${{ steps.refs.outputs.cube }}
          path: sources/cube
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/play
          ref: ${{ steps.refs.outputs.play }}
          path: sources/play
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cubearc/recipes
          ref: ${{ steps.refs.outputs.recipes }}
          path: sources/recipes
          persist-credentials: false
      - name: Discover the SDK at the reviewed Cube revision
        id: sdk
        run: |
          if test -f ../sources/cube/bindings/javascript/package.json; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test isolated application state and provenance
        run: |
          npm ci --ignore-scripts --no-audit --no-fund --prefix playground
          npm test --prefix playground
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.sdk.outputs.available == 'true'
        with:
          targets: wasm32-unknown-unknown
      - name: Build the SDK from the recorded Cube revision
        if: steps.sdk.outputs.available == 'true'
        working-directory: sources/cube/bindings/javascript
        run: |
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          mkdir -p "$RUNNER_TEMP/cube-sdk"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/cube-sdk"
      - name: Build and exercise the actual application package
        if: steps.sdk.outputs.available == 'true'
        run: |
          sdk_tarball=$(find "$RUNNER_TEMP/cube-sdk" -name '*.tgz' -type f)
          sdk_sha256=$(sha256sum "$sdk_tarball" | cut -d ' ' -f 1)
          node playground/scripts/build.mjs --sdk "$sdk_tarball" --sdk-sha256 "$sdk_sha256" --cube-source ../sources/cube
          npm ci --ignore-scripts --no-audit --no-fund --prefix ../sources/cube/bindings/javascript
          ../sources/cube/bindings/javascript/node_modules/.bin/playwright install --with-deps chromium firefox webkit
          node --test playground/tests/pipeline-import.integration.mjs
          for browser in chromium firefox webkit; do
            PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/sources/cube/bindings/javascript/node_modules/playwright" BROWSER_ENGINE="$browser" PLAYGROUND_A11Y_REPORT="$RUNNER_TEMP/playground-a11y-$browser.json" node --test playground/tests/browser.e2e.mjs
          done
      - name: Retain automated accessibility evidence
        if: always() && steps.sdk.outputs.available == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playground-accessibility
          path: ${{ runner.temp }}/playground-a11y-*.json
          if-no-files-found: warn
      - name: Test publishing and link-check failures
        run: python3 -m unittest discover -s tests -v
      - name: Check the authored Markdown
        run: |
          python3 tools/check_links.py .
          python3 tools/check_links.py ../sources/cube
          python3 tools/check_links.py ../sources/play
          python3 tools/check_links.py ../sources/recipes
      - name: Install pinned mdBook
        run: python3 tools/install_mdbook.py
      - name: Build and verify the recorded sources
        run: |
          if test "${{ steps.sdk.outputs.available }}" = true; then
            python3 tools/site.py build --sources-root ../sources --locked --playground playground/dist
          else
            python3 tools/site.py build --sources-root ../sources --locked
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
